<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1120"><title>Daily Life Manager</title><link rel="manifest" href="./manifest.json"><link rel="icon" href="./icon.svg" type="image/svg+xml"><style>
:root{--bg:#f4f7fb;--card:#fff;--tx:#111827;--mut:#5b6472;--ln:#e5e9f0;--ac:#2563eb;--dg:#dc2626}
[data-theme=dark]{--bg:#0b1120;--card:#111a2e;--tx:#e5edf8;--mut:#94a3b8;--ln:#243149;--ac:#60a5fa;--dg:#f87171}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:40px}
header{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--ln);padding:10px;z-index:9}
.row{display:flex;gap:8px;align-items:center}.wrap{max-width:800px;margin:auto;padding:12px}
h1{font-size:16px;margin:0;flex:1}button,input,select,textarea{font:inherit;color:var(--tx)}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--ln);border-radius:10px;background:var(--bg)}
button{padding:9px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--card);cursor:pointer}
.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}.d{color:var(--dg);border-color:var(--dg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.tile{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px;min-height:110px;cursor:pointer}
.tile b{display:block;margin-top:6px}.tile small{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px;margin:10px 0}
.item{border:1px solid var(--ln);border-radius:12px;padding:10px;margin-top:10px;background:var(--bg)}
.item.done{opacity:.6}img{width:100%;max-height:170px;object-fit:cover;border-radius:10px;margin-top:8px}
.meta{color:var(--mut);font-size:12px;margin-top:4px}.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
.modal{display:none;position:fixed;inset:0;background:#0009;padding:12px;overflow:auto;z-index:20}
.modal .card{max-width:620px;margin:16px auto}section{display:none}section.on{display:block}
.empty{color:var(--mut);text-align:center;padding:18px;border:1px dashed var(--ln);border-radius:12px;margin-top:10px}
</style></head><body data-theme="light">
<header><div class="row wrap" style="padding:0"><button onclick="show('home')">🏠</button><h1>Self Daily Life Smart Manage</h1><button class="p" onclick="openAdd()">＋ Add</button><button onclick="theme()">🌙</button></div></header>
<div class="wrap">
<input id="q" placeholder="Search everything…" style="margin-top:10px" oninput="render()">
<div id="home" class="on"><div class="grid" id="tiles"></div><div class="card"><b>Today’s Items</b><div id="up"></div></div><div class="card"><b>Manage Tiles</b><div class="acts"><button onclick="tm.style.display='block'">＋ New tile</button><button onclick="renameTile()">✏️ Rename current</button></div></div><div class="card"><b>Phone Change Backup</b><p class="small">Data is saved on this phone. Before changing your phone, tap Export Backup and keep the file in Google Drive/WhatsApp. In the new phone, use Import Backup.</p><div class="acts"><button onclick="exportData()">⬇️ Export Backup</button><button onclick="document.getElementById('imp').click()">⬆️ Import Backup</button><input id="imp" type="file" accept=".json" hidden></div></div></div>
<div id="pages"></div>
<div id="m" class="modal"><div class="card"><div class="row"><h2 id="mt" style="flex:1;font-size:16px;margin:0">Add Item</h2><button onclick="m.style.display='none'">✕</button></div>
<label>Section</label><select id="fs"></select><label>Title *</label><input id="ft"><label>Date</label><input id="fw" type="date"><label>Priority</label><select id="fp"><option>Low</option><option selected>Medium</option><option>High</option></select><label>Notes</label><textarea id="fn" rows="3"></textarea>
<label>Photo</label><div class="acts"><button onclick="fg.click()">🖼️ Gallery</button><button onclick="fc.click()">📷 Camera</button></div><input id="fg" type="file" accept="image/*" hidden><input id="fc" type="file" accept="image/*" capture="environment" hidden><div id="pp"></div>
<label>Office / important file</label><input id="ff" type="file"><div id="fpn" class="meta"></div><label>Status</label><select id="fst"><option>Pending</option><option>In progress</option><option>Completed</option></select>
<div class="acts"><button class="p" onclick="saveItem()">Save</button><button onclick="m.style.display='none'">Cancel</button></div></div></div>
<div id="tm" class="modal"><div class="card"><div class="row"><h2 style="flex:1;font-size:16px;margin:0">New Tile</h2><button onclick="tm.style.display='none'">✕</button></div><label>Name</label><input id="tn"><label>Icon</label><select id="ti"><option>📌</option><option>📅</option><option>💰</option><option>💼</option><option>🏃</option><option>✈️</option><option>🔔</option><option>🏫</option><option>🍽️</option></select><button class="p" style="margin-top:10px" onclick="newTile()">Create</button></div></div>
</div>
<script>
let S=JSON.parse(localStorage.getItem('s')||'null')||[{id:'daily',n:'Daily Activities',i:'📅'},{id:'family',n:'Family Responsibilities',i:'👨‍👩‍👧'},{id:'money',n:'Fees, Insurance & Bills',i:'💰'},{id:'office',n:'Office Work & Files',i:'💼'},{id:'fitness',n:'Physical Fitness',i:'🏃'},{id:'food',n:'Daily Food Menu',i:'🍽️'},{id:'travel',n:'Travelling',i:'✈️'},{id:'rem',n:'Reminders',i:'🔔'}];
let D=JSON.parse(localStorage.getItem('d')||'{}'),cur='daily',edit=null,ph=null,fl=null,fn='';
const $=id=>document.getElementById(id),esc=s=>(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
function store(){localStorage.setItem('s',JSON.stringify(S));localStorage.setItem('d',JSON.stringify(D))}
function refresh(){store();render()}
function show(x){document.querySelectorAll('.on').forEach(e=>e.classList.remove('on'));$(x).classList.add('on');scrollTo(0,0)}
function openAdd(){fs.innerHTML=S.map(s=>`<option value="${s.id}">${s.i} ${esc(s.n)}</option>`).join('');mt.textContent='Add Item';edit=null;ft.value=fw.value=fn.value='';fw.value=today();fp.value='Medium';fst.value='Pending';fg.value=fc.value=ff.value='';ph=fl=null;fn='';pp.innerHTML=fpn.textContent='';m.style.display='block'}
fg.onchange=fc.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{ph=r.result;pp.innerHTML=`<img src="${ph}">`};r.readAsDataURL(f)};
ff.onchange=e=>{fl=e.target.files[0];fn=fl.name;fpn.textContent='Selected: '+fn};
function saveItem(){if(!ft.value.trim()){alert('Please enter title');return}const sec=fs.value;const o={id:edit||Date.now(),t:ft.value.trim(),w:fw.value,p:fp.value,n:fn.value,st:fst.value,ph:ph,f:fl?URL.createObjectURL(fl):null,fn};D[sec]=D[sec]||[];if(edit){let k=-1;D[sec].forEach((x,i)=>{if(x.id==edit)k=i});if(k>-1)D[sec][k]=o}else D[sec].unshift(o);refresh();m.style.display='none';show(sec)}
function edit1(s,id){openAdd();fs.value=s;const o=D[s].find(x=>x.id==id);edit=id;mt.textContent='Edit Item';ft.value=o.t;fw.value=o.w||today();fp.value=o.p;fn.value=o.n||'';fst.value=o.st;ph=o.ph||null;pp.innerHTML=o.ph?`<img src="${o.ph}">`:'';fpn.textContent=o.fn?'Existing: '+o.fn:''}
function del(s,id){if(confirm('Delete this item?')){D[s]=D[s].filter(x=>x.id!=id);refresh()}}
function done(s,id){const o=D[s].find(x=>x.id==id);o.st=o.st=='Completed'?'Pending':'Completed';refresh()}
function dateText(w){if(!w)return'No date';return w==today()?'Today':new Date(w+'T00:00').toLocaleDateString()}
function ih(s,o){const qq=q.value.toLowerCase();if(qq&&!(o.t+' '+(o.n||'')+' '+(o.fn||'')).toLowerCase().includes(qq))return'';return `<div class="item ${o.st=='Completed'?'done':''}">${o.ph?`<img src="${o.ph}">`:''}<b>${esc(o.t)}</b><div class="meta">${esc(o.p)} • ${esc(o.st)} • ${dateText(o.w)}</div>${o.n?`<div class="meta">${esc(o.n)}</div>`:''}${o.f?`<a href="${o.f}" download="${esc(o.fn)}">📎 ${esc(o.fn||'file')}</a>`:''}<div class="acts"><button onclick="done('${s}',${o.id})">${o.st=='Completed'?'Undo':'Done'}</button><button onclick="edit1('${s}',${o.id})">Edit</button><button class="d" onclick="del('${s}',${o.id})">Delete</button></div></div>`}
function newTile(){if(!tn.value.trim())return;S.push({id:'t'+Date.now(),n:tn.value.trim(),i:ti.value});tn.value='';refresh();tm.style.display='none'}
function renameTile(){const s=S.find(x=>x.id==cur);const n=prompt('New tile name',s.n);if(n&&n.trim()){s.n=n.trim();refresh()}}
function theme(){document.body.dataset.theme=document.body.dataset.theme=='dark'?'light':'dark';localStorage.setItem('th',document.body.dataset.theme)}
if(localStorage.getItem('th')=='dark')document.body.dataset.theme='dark';
function exportData(){const a=document.createElement('a');a.href='data:application/json,'+encodeURIComponent(JSON.stringify({S,D}));a.download='daily-life-backup-'+today()+'.json';a.click()}
imp.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(x.S)S=x.S;if(x.D)D=x.D;refresh();alert('Backup imported successfully')}catch(err){alert('Invalid backup file')}};r.readAsText(f)};
function render(){tiles.innerHTML=S.map(s=>`<div class="tile" onclick="open1('${s.id}')"><small>${(D[s.id]||[]).length} items</small><b>${s.i} ${esc(s.n)}</b><small>Tap to open</small></div>`).join('');
pages.innerHTML=S.map(s=>`<section id="${s.id}"><div class="card"><div class="row"><button onclick="show('home')">←</button><h2 style="flex:1;font-size:16px;margin:0">${s.i} ${esc(s.n)}</h2><button class="p" onclick="openAdd()">＋ Add</button></div></div><div>${(D[s.id]||[]).map(o=>ih(s.id,o)).join('')||'<div class="empty">No items yet</div>'}</div></section>`).join('');
let a=[];S.forEach(s=>(D[s.id]||[]).forEach(o=>{if(o.w==today())a.push({...o,s:s.id,n:s.n})}));
up.innerHTML=a.map(o=>`<div class="item"><b>${esc(o.t)}</b><div class="meta">${esc(o.n)} • Today</div><div class="acts"><button onclick="open1('${o.s}')">Open</button></div></div>`).join('')||'<div class="empty">No items for today</div>'}
function open1(id){cur=id;show(id)}
setInterval(()=>{if(!('Notification'in window)||Notification.permission!=='granted')return;S.forEach(s=>(D[s.id]||[]).forEach(o=>{if(o.w==today()&&!o.nt){o.nt=1;new Notification('Today: '+o.t,{body:o.n||s.n});store()}}))},60000);
render();
</script></body></html>
